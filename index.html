<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank you</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#00386B,#0072CE);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#00386B;overflow:hidden}

h1{font-size:30px;margin:8px 0 10px}
p{font-size:17px;line-height:26px;color:#334155;margin:0 0 8px}

</style></head><body><canvas id="c"></canvas>
